<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <nav>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('layout_info') }}">Project Layouts</a>
    </nav>

    <div class="container">
        <h1>{{ title }}</h1>
        <p>Flask doesn't enforce a project structure, but here are common patterns from simple to professional:</p>

        {% for layout_name, structure in layouts.items() %}
        <div class="card">
            <h2>{{ layout_name }}</h2>
            <pre><code>{{ structure }}</code></pre>
        </div>
        {% endfor %}
    </div>

    <footer>
        <p>Flask Coursework — Module 04</p>
    </footer>
</body>

</html>
