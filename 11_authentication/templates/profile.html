{% extends "index.html" %}
{% block content %}
<h1>Profile</h1>
<div class="card">
    <p><strong>Username:</strong> {{ current_user.username }}</p>
    <p><strong>Email:</strong> {{ current_user.email }}</p>
    <p><strong>Role:</strong> {{ current_user.role }}</p>
    <p><strong>Joined:</strong> {{ current_user.created_at.strftime('%Y-%m-%d') if current_user.created_at else 'N/A' }}
    </p>
</div>
{% endblock %}
